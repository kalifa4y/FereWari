name: FereWari CI/CD Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run automated test suite
      run: npx tsx src/tests/runner.ts

    - name: Compile production build
      run: npm run build

    - name: Verify build artifacts
      run: |
        test -f dist/index.html
        test -f dist/sw.js
        test -f dist/manifest.webmanifest
        echo "✅ Production artifacts successfully verified!"
